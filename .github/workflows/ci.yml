name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint design system governance
        run: npm run lint

      - name: Typecheck packages and catalog
        run: npm run typecheck

      - name: Run @moonwitness/ui and catalog unit tests
        run: npm run test

      - name: Build production UI catalog
        run: npm run build

      - name: Install Playwright Chromium
        run: npx --workspace=@moonwitness/ui-catalog playwright install chromium --with-deps

      - name: Run Playwright integration & accessibility suite
        run: npm run test:e2e

  docker:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/moonwitness/mw-design:latest
