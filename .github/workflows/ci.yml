name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check conventional commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s origin/main..HEAD | while IFS= read -r msg; do
            echo "$msg" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|build|ci|revert|security|deps|style|release)(\(.+\))?!?: .+' || { echo "Invalid: $msg"; exit 1; }
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint design system governance
        run: bun run lint

      - name: Typecheck packages and catalog
        run: bun run typecheck

      - name: Run @moonwitness/ui and catalog unit tests
        run: bun run test

      - name: Verify modular exports, pack integrity & bundle budgets
        run: bun run verify:pack

      - name: Build production UI catalog
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx --workspace=@moonwitness/ui-catalog playwright install chromium --with-deps

      - name: Run Playwright integration & accessibility suite
        env:
          MW_UI_CATALOG_BASE_PATH: '/moonwitness-xiv/components/'
        run: bun run test:e2e

  docker:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/moonwitness/mw-design:latest
