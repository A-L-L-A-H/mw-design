name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full governance, typecheck, tests & pack check
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run verify:pack

      - name: Publish @moonwitness/ui with npm provenance
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --workspace=@moonwitness/ui --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
